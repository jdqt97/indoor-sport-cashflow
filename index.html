        // ==================== VENDOR CONCENTRATION ANALYSIS ====================
        function VendorConcentrationAnalysis({ stats }) {
            const herfRef = useRef(null);
            const vendors = stats.vendorList;
            const totalSpend = stats.totalVendorSpend;

            // Calculate Herfindahl-Hirschman Index (HHI) for concentration
            const hhi = vendors.reduce((sum, v) => {
                const share = (v.total / totalSpend) * 100;
                return sum + share * share;
            }, 0);

            const concentration = hhi > 2500 ? 'Alta' : hhi > 1500 ? 'Moderada' : 'Baja';
            const concentrationColor = hhi > 2500 ? 'red' : hhi > 1500 ? 'yellow' : 'green';

            // Cumulative spend chart
            useChart(herfRef, () => {
                const sorted = [...vendors].sort((a, b) => b.total - a.total);
                let cumulative = 0;
                const cumData = sorted.map(v => {
                    cumulative += (v.total / totalSpend) * 100;
                    return cumulative;
                });

                return {
                    type: 'line',
                    data: {
                        labels: sorted.map((v, i) => `P${i + 1}`),
                        datasets: [
                            {
                                label: '% Acumulado de Compras',
                                data: cumData,
                                borderColor: '#1E40AF',
                                backgroundColor: 'rgba(30,64,175,0.1)',
                                fill: true,
                                tension: 0.3,
                                pointRadius: 4,
                            },
                            {
                                label: 'Linea 80%',
                                data: Array(sorted.length).fill(80),
                                borderColor: '#F59E0B',
                                borderDash: [5, 5],
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        if (ctx.datasetIndex === 0) {
                                            const v = sorted[ctx.dataIndex];
                                            return `${v.name}: ${ctx.raw.toFixed(1)}% acumulado`;
                                        }
                                        return 'Umbral Pareto 80%';
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                min: 0,
                                max: 100,
                                ticks: { callback: (v) => `${v}%` }
                            }
                        }
                    }
                };
            }, [vendors, totalSpend]);

            // Count vendors for 80% of spend
            let cumPct = 0;
            let vendorsFor80 = 0;
            const sortedVendors = [...vendors].sort((a, b) => b.total - a.total);
            for (const v of sortedVendors) {
                cumPct += (v.total / totalSpend) * 100;
                vendorsFor80++;
                if (cumPct >= 80) break;
            }

            return (
                <div className="card">
                    <h3 className="font-semibold text-slate-700 mb-4">Analisis de Concentracion de Proveedores</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div className={`p-3 rounded-lg ${concentrationColor === 'red' ? 'bg-red-50' : concentrationColor === 'yellow' ? 'bg-yellow-50' : 'bg-green-50'}`}>
                            <p className="text-xs text-slate-500 mb-1">Indice de Concentracion (HHI)</p>
                            <p className={`text-xl font-bold ${concentrationColor === 'red' ? 'text-red-700' : concentrationColor === 'yellow' ? 'text-yellow-700' : 'text-green-700'}`}>
                                {Math.round(hhi)}
                            </p>
                            <p className="text-xs text-slate-500">Concentracion: {concentration}</p>
                        </div>
                        <div className="p-3 rounded-lg bg-blue-50">
                            <p className="text-xs text-slate-500 mb-1">Proveedores Activos</p>
                            <p className="text-xl font-bold text-blue-700">{vendors.length}</p>
                            <p className="text-xs text-slate-500">Total: {formatCOP(totalSpend)}</p>
                        </div>
                        <div className="p-3 rounded-lg bg-purple-50">
                            <p className="text-xs text-slate-500 mb-1">Regla Pareto</p>
                            <p className="text-xl font-bold text-purple-700">{vendorsFor80} proveedores</p>
                            <p className="text-xs text-slate-500">Representan el 80% de las compras</p>
                        </div>
                    </div>
                    <div style={{ height: 250 }}>
                        <canvas ref={herfRef}></canvas>
                    </div>
                </div>
            );
        }

        // ==================== EXTENDED PROJECTIONS PANEL ====================
        function ExtendedProjectionsPanel({ stats }) {
            const breakEvenRef = useRef(null);
            const monthlyIncome = stats.totalIncome;
            const monthlyExpense = stats.totalExpense;
            const fixedCosts = (stats.categories['GASTOS OPERACIONALES']?.expense || 0) +
                              (stats.categories['GASTOS FINANCIEROS']?.expense || 0);
            const variableCosts = stats.totalExpense - fixedCosts;
            const variableCostRatio = variableCosts / monthlyIncome;

            // Break-even analysis
            const breakEvenSales = fixedCosts / (1 - variableCostRatio);
            const currentMargin = ((monthlyIncome - monthlyExpense) / monthlyIncome * 100).toFixed(1);
            const operatingLeverage = fixedCosts / stats.totalExpense;

            useChart(breakEvenRef, () => {
                const salesRange = Array.from({ length: 20 }, (_, i) => monthlyIncome * (0.3 + i * 0.05));
                return {
                    type: 'line',
                    data: {
                        labels: salesRange.map(s => formatCOP(s)),
                        datasets: [
                            {
                                label: 'Ingresos',
                                data: salesRange,
                                borderColor: '#059669',
                                tension: 0,
                                pointRadius: 0,
                            },
                            {
                                label: 'Costos Totales',
                                data: salesRange.map(s => fixedCosts + s * variableCostRatio),
                                borderColor: '#DC2626',
                                tension: 0,
                                pointRadius: 0,
                            },
                            {
                                label: 'Costos Fijos',
                                data: salesRange.map(() => fixedCosts),
                                borderColor: '#F59E0B',
                                borderDash: [5, 5],
                                tension: 0,
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => `${ctx.dataset.label}: ${formatCOP(ctx.raw)}`
                                }
                            }
                        },
                        scales: {
                            y: { ticks: { callback: (v) => formatCOP(v) } },
                            x: {
                                ticks: {
                                    maxTicksLimit: 8,
                                    font: { size: 9 },
                                    maxRotation: 45,
                                }
                            }
                        }
                    }
                };
            }, [stats]);

            return (
                <div className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="card text-center">
                            <p className="text-xs text-slate-500 uppercase mb-1">Punto de Equilibrio</p>
                            <p className="text-lg font-bold text-blue-800">{formatCOP(breakEvenSales)}</p>
                            <p className="text-xs text-slate-400">Ventas minimas mensuales</p>
                        </div>
                        <div className="card text-center">
                            <p className="text-xs text-slate-500 uppercase mb-1">Costos Fijos</p>
                            <p className="text-lg font-bold text-yellow-600">{formatCOP(fixedCosts)}</p>
                            <p className="text-xs text-slate-400">{(operatingLeverage * 100).toFixed(0)}% del gasto total</p>
                        </div>
                        <div className="card text-center">
                            <p className="text-xs text-slate-500 uppercase mb-1">Costos Variables</p>
                            <p className="text-lg font-bold text-red-600">{formatCOP(variableCosts)}</p>
                            <p className="text-xs text-slate-400">{(variableCostRatio * 100).toFixed(0)}% de ingresos</p>
                        </div>
                        <div className="card text-center">
                            <p className="text-xs text-slate-500 uppercase mb-1">Margen de Seguridad</p>
                            <p className="text-lg font-bold text-green-600">{((1 - breakEvenSales / monthlyIncome) * 100).toFixed(1)}%</p>
                            <p className="text-xs text-slate-400">Holgura sobre punto de equilibrio</p>
                        </div>
                    </div>
                    <div className="card">
                        <h3 className="font-semibold text-slate-700 mb-3">Analisis de Punto de Equilibrio</h3>
                        <div style={{ height: 300 }}>
                            <canvas ref={breakEvenRef}></canvas>
                        </div>
                    </div>
                </div>
            );
        }

        // ==================== KEY RATIOS PANEL ====================
        function KeyRatiosPanel({ stats }) {
            const ratios = [
                {
                    name: 'Margen de Flujo Neto',
                    value: ((stats.netFlow / stats.totalIncome) * 100).toFixed(1) + '%',
                    description: 'Porcentaje de ingresos que se convierte en flujo libre',
                    benchmark: '> 10% es saludable',
                    status: (stats.netFlow / stats.totalIncome) > 0.10 ? 'green' : (stats.netFlow / stats.totalIncome) > 0 ? 'yellow' : 'red',
                },
                {
                    name: 'Ratio de Gastos Operativos',
                    value: (((stats.categories['GASTOS OPERACIONALES']?.expense || 0) / stats.totalIncome) * 100).toFixed(1) + '%',
                    description: 'Gastos operativos como porcentaje de ingresos',
                    benchmark: '< 30% es optimo',
                    status: ((stats.categories['GASTOS OPERACIONALES']?.expense || 0) / stats.totalIncome) < 0.30 ? 'green' : ((stats.categories['GASTOS OPERACIONALES']?.expense || 0) / stats.totalIncome) < 0.50 ? 'yellow' : 'red',
                },
                {
                    name: 'Ratio de Compras a Proveedores',
                    value: ((stats.totalVendorSpend / stats.totalIncome) * 100).toFixed(1) + '%',
                    description: 'Porcentaje de ingresos destinado a proveedores',
                    benchmark: 'Variable segun industria',
                    status: (stats.totalVendorSpend / stats.totalIncome) < 0.60 ? 'green' : (stats.totalVendorSpend / stats.totalIncome) < 0.75 ? 'yellow' : 'red',
                },
                {
                    name: 'Cobertura de Gastos',
                    value: `${stats.daysOfCoverage} dias`,
                    description: 'Dias que el saldo actual cubre operaciones',
                    benchmark: '> 30 dias recomendado',
                    status: stats.daysOfCoverage > 30 ? 'green' : stats.daysOfCoverage > 15 ? 'yellow' : 'red',
                },
                {
                    name: 'Costo Financiero / Ingresos',
                    value: (((stats.categories['GASTOS FINANCIEROS']?.expense || 0) / stats.totalIncome) * 100).toFixed(2) + '%',
                    description: 'Peso de los gastos financieros sobre ingresos',
                    benchmark: '< 5% es aceptable',
                    status: ((stats.categories['GASTOS FINANCIEROS']?.expense || 0) / stats.totalIncome) < 0.05 ? 'green' : ((stats.categories['GASTOS FINANCIEROS']?.expense || 0) / stats.totalIncome) < 0.10 ? 'yellow' : 'red',
                },
                {
                    name: 'Indice de Liquidez',
                    value: (stats.saldoFinal / (stats.totalExpense / 30)).toFixed(1),
                    description: 'Capacidad de cubrir gastos diarios con saldo disponible',
                    benchmark: '> 1.5 es saludable',
                    status: (stats.saldoFinal / (stats.totalExpense / 30)) > 1.5 ? 'green' : (stats.saldoFinal / (stats.totalExpense / 30)) > 1 ? 'yellow' : 'red',
                },
            ];

            const statusColors = {
                green: 'bg-green-50 border-green-200 text-green-700',
                yellow: 'bg-yellow-50 border-yellow-200 text-yellow-700',
                red: 'bg-red-50 border-red-200 text-red-700',
            };
            const statusIcons = { green: '\u2705', yellow: '\u26A0\uFE0F', red: '\u274C' };

            return (
                <div className="card">
                    <h3 className="font-semibold text-slate-700 mb-4">Indicadores Financieros Clave</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {ratios.map((r, i) => (
                            <div key={i} className={`p-4 rounded-lg border ${statusColors[r.status]}`}>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-medium text-sm">{r.name}</span>
                                    <span>{statusIcons[r.status]}</span>
                                </div>
                                <p className="text-2xl font-bold mb-1">{r.value}</p>
                                <p className="text-xs opacity-75">{r.description}</p>
                                <p className="text-xs opacity-60 mt-1">Referencia: {r.benchmark}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ==================== EXPENSE TREND MICRO CHART ====================
        function ExpenseTrendPanel({ transactions }) {
            const trendRef = useRef(null);

            const categoryTrends = useMemo(() => {
                const byWeekCat = {};
                transactions.forEach(tx => {
                    if (tx.expense <= 0) return;
                    const d = tx.date;
                    const ws = new Date(d);
                    ws.setDate(d.getDate() - d.getDay() + 1);
                    const weekKey = formatDate(ws);
                    if (!byWeekCat[weekKey]) byWeekCat[weekKey] = {};
                    if (!byWeekCat[weekKey][tx.category]) byWeekCat[weekKey][tx.category] = 0;
                    byWeekCat[weekKey][tx.category] += tx.expense;
                });
                return byWeekCat;
            }, [transactions]);

            const weeks = Object.keys(categoryTrends).sort();
            const cats = ['PROVEEDORES', 'GASTOS OPERACIONALES', 'GASTOS FINANCIEROS', 'MOVIMIENTOS INTERNOS', 'OTROS'];
            const catColors = ['#1E40AF', '#DC2626', '#F59E0B', '#8B5CF6', '#64748B'];

            useChart(trendRef, () => ({
                type: 'bar',
                data: {
                    labels: weeks,
                    datasets: cats.map((cat, i) => ({
                        label: cat,
                        data: weeks.map(w => categoryTrends[w]?.[cat] || 0),
                        backgroundColor: catColors[i],
                        borderRadius: 2,
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.dataset.label}: ${formatCOP(ctx.raw)}`
                            }
                        },
                        legend: {
                            position: 'top',
                            labels: { font: { size: 10 } }
                        }
                    },
                    scales: {
                        x: { stacked: true },
                        y: {
                            stacked: true,
                            ticks: { callback: (v) => formatCOP(v) }
                        }
                    }
                }
            }), [categoryTrends]);

            return (
                <div className="card">
                    <h3 className="font-semibold text-slate-700 mb-3">Tendencia de Egresos por Categoria (Semanal)</h3>
                    <div style={{ height: 300 }}>
                        <canvas ref={trendRef}></canvas>
                    </div>
                </div>
            );
        }

        // ==================== INCOME SOURCES PANEL ====================
        function IncomeSourcesPanel({ transactions }) {
            const pieRef = useRef(null);
            const sources = useMemo(() => {
                const map = {};
                transactions.filter(t => t.income > 0).forEach(tx => {
                    const desc = tx.description.substring(0, 35);
                    if (!map[desc]) map[desc] = { total: 0, count: 0 };
                    map[desc].total += tx.income;
                    map[desc].count++;
                });
                return Object.entries(map)
                    .map(([k, v]) => ({ name: k, ...v }))
                    .sort((a, b) => b.total - a.total);
            }, [transactions]);

            useChart(pieRef, () => {
                const top8 = sources.slice(0, 8);
                return {
                    type: 'doughnut',
                    data: {
                        labels: top8.map(s => s.name),
                        datasets: [{
                            data: top8.map(s => s.total),
                            backgroundColor: ['#059669', '#10B981', '#34D399', '#6EE7B7', '#A7F3D0', '#86EFAC', '#4ADE80', '#22C55E']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'right', labels: { font: { size: 9 } } },
                            tooltip: { callbacks: { label: (ctx) => `${formatCOP(ctx.raw)}` } }
                        }
                    }
                };
            }, [sources]);

            return (
                <div className="card">
                    <h3 className="font-semibold text-slate-700 mb-3">Fuentes de Ingreso</h3>
                    <div style={{ height: 280 }}>
                        <canvas ref={pieRef}></canvas>
                    </div>
                    <div className="mt-3 space-y-1">
                        {sources.slice(0, 5).map((s, i) => (
                            <div key={i} className="flex items-center justify-between text-xs p-1">
                                <span className="text-slate-600 truncate max-w-xs">{s.name}</span>
                                <span className="font-medium text-green-600">{formatCOP(s.total)} ({s.count}x)</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ==================== FOOTER COMPONENT ====================
        function Footer() {
            return (
                <footer className="bg-slate-800 text-slate-400 text-center py-6 mt-8">
                    <p className="text-sm">INDOOR SPORT SAS | NIT 277.000.476-58</p>
                    <p className="text-xs mt-1">Dashboard de Analisis Financiero | Itagui, Antioquia, Colombia</p>
                    <p className="text-xs mt-1">Generado el {new Date().toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                </footer>
            );
        }

        // ==================== RENDER APP ====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
